<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f8fc">
  <title>王橹杰超话 · 超话日程</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <script src="transfer.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span aria-hidden="true" class="brand-mark">✦</span> 超话日程</div>
      <time id="today-label"></time>
    </header>
    <main id="main">
      <section class="page" id="home" aria-labelledby="topic">
        <div class="hero">
          <div>
            <span class="hero-label">今日超话</span>
            <h1 id="topic">王橹杰超话</h1>
            <a class="hero-link" id="topic-link" href="https://weibo.com/p/1008080587fa0e8198ad45108f3a0ef6e08d3a" target="_blank" rel="noopener noreferrer">打开超话主页</a>
          </div>
          <div class="ring" id="progress-ring"><div class="ring-content"><strong id="progress-count"></strong><span>今日完成</span></div></div>
        </div>
        <div class="summary" id="summary" aria-label="今日进度"></div>
        <div class="section-head">
          <h2>今日任务</h2>
          <div class="inline-actions">
            <button class="secondary" data-plan type="button">生成清单</button>
            <button class="secondary" data-new type="button">新建任务</button>
          </div>
        </div>
        <div id="today-guide" class="panel guide"></div>
        <div id="home-list" class="cards"></div>
        <div id="week" class="panel note" aria-labelledby="week-title">
          <h2 id="week-title">近 7 日任务记录</h2>
          <p id="week-summary"></p>
          <a id="week-link" class="action-link" target="_blank" rel="noopener noreferrer">到微博查看经验和排行</a>
        </div>
      </section>
      <section class="page" id="tasks" hidden aria-labelledby="tasks-title">
        <div class="section-head">
          <h1 id="tasks-title">任务与草稿</h1>
          <div class="inline-actions">
            <button class="secondary" data-plan type="button">生成清单</button>
            <button class="primary" data-new type="button">新建任务</button>
          </div>
        </div>
        <label class="filter">查看状态 <select id="filter"><option value="">全部任务</option><option value="todo">待完成</option><option value="verify">待本人验证</option><option value="done">已完成</option></select></label>
        <div id="task-list" class="cards"></div>
      </section>
      <section class="page" id="accounts" hidden aria-labelledby="account-title">
        <h1 id="account-title">账号分组</h1>
        <p>在本机给任务标注归属。微博登录和验证在微博内完成。</p>
        <form id="account-form" class="panel form-panel">
          <label>账号别名<input name="alias" maxlength="30" required placeholder="如：我的微博"></label>
          <label>分组（选填）<input name="group" maxlength="30" placeholder="如：日常"></label>
          <button class="primary" type="submit">添加别名</button>
        </form>
        <div id="account-list" class="cards"></div>
      </section>
      <section class="page" id="settings" hidden aria-labelledby="settings-title">
        <h1 id="settings-title">设置</h1>
        <form id="settings-form" class="panel form-panel">
          <label>超话名称<input name="topic" maxlength="40" required></label>
          <label>超话主页链接（选填）<input name="link" type="url" maxlength="2000" inputmode="url" placeholder="从微博客户端复制链接"></label>
          <button class="primary" type="submit">保存设置</button>
        </form>
        <div class="panel note">
          <h2>日历提醒</h2>
          <p>在任务内设置时间并下载日历文件。导入系统日历后，由日历发出提醒。</p>
        </div>
        <div class="panel note">
          <h2>跨设备交接</h2>
          <p>导出任务、草稿和账号别名后，可通过 iCloud Drive 或隔空投送传给另一台设备。导入时添加缺少的记录，已存在的进度以本机为准。</p>
          <div class="inline-actions">
            <button class="secondary" id="export-data" type="button">导出备份</button>
            <button class="secondary" id="pick-import" type="button">导入备份</button>
            <input id="import-data" type="file" accept=".json,application/json" hidden>
          </div>
        </div>
      </section>
    </main>
  </div>
  <nav aria-label="主导航" class="bottom-nav">
    <button data-page="home" aria-current="page"><span aria-hidden="true">⌂</span>首页</button>
    <button data-page="tasks"><span aria-hidden="true">☷</span>任务</button>
    <button data-page="accounts"><span aria-hidden="true">◎</span>账号</button>
    <button data-page="settings"><span aria-hidden="true">⚙︎</span>设置</button>
  </nav>
  <dialog id="plan-editor" aria-labelledby="plan-title">
    <form id="plan-form" class="editor-form">
      <div class="section-head"><h2 id="plan-title">生成任务清单</h2><button type="button" class="secondary" id="close-plan">关闭</button></div>
      <div class="form-grid">
        <label>日期<input name="day" type="date" required></label>
        <label>账号别名<select name="account"></select></label>
      </div>
      <fieldset class="choices">
        <legend>选择项目</legend>
        <label><input type="checkbox" name="kinds" value="签到" checked>签到</label>
        <label><input type="checkbox" name="kinds" value="评论" checked>评论</label>
        <label><input type="checkbox" name="kinds" value="转发" checked>转发</label>
        <label><input type="checkbox" name="kinds" value="发帖" checked>发帖</label>
      </fieldset>
      <p id="plan-error" role="status"></p>
      <button class="primary" type="submit">添加到清单</button>
    </form>
  </dialog>
  <dialog id="guide-editor" aria-labelledby="guide-title">
    <div class="editor-form">
      <div class="section-head"><h2 id="guide-title">下一项任务</h2><button type="button" class="secondary" id="close-guide">关闭</button></div>
      <div id="guide-content" class="cards"></div>
    </div>
  </dialog>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="task-form" class="editor-form">
      <div class="section-head"><h2 id="editor-title">新建任务</h2><button type="button" class="secondary" id="close-editor">关闭</button></div>
      <label>任务名称<input name="title" required maxlength="60"></label>
      <div class="form-grid">
        <label>任务类型<select name="kind"><option>签到</option><option>评论</option><option>转发</option><option>发帖</option></select></label>
        <label>账号别名<select name="account"></select></label>
        <label>日期<input name="day" type="date" required></label>
        <label>日历提醒（选填）<input name="time" type="time"></label>
      </div>
      <label>目标超话或帖子链接（选填）<input name="link" type="url" maxlength="2000" placeholder="从微博客户端复制链接"></label>
      <label id="sync-field" hidden>发布时确认
        <select name="syncPreference"><option value="default">在微博内决定</option><option value="topic">仅发到超话</option><option value="home">同时同步微博主页</option></select>
      </label>
      <label>完成后的微博链接（选填）<input name="resultLink" type="url" maxlength="2000" inputmode="url" placeholder="操作完成后粘贴分享链接"></label>
      <label>草稿或备注（选填）<textarea name="draft" rows="4" maxlength="2500"></textarea></label>
      <div class="dialog-actions">
        <button class="danger" id="delete-task" type="button">删除任务</button>
        <button class="primary" type="submit">保存任务</button>
      </div>
    </form>
  </dialog>
  <p id="message" class="toast" role="status" hidden></p>
</body>
</html>
